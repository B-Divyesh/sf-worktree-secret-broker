[package]
name = "worktree-secret-broker"
version = "0.1.0"
edition = "2024"
description = "Short-lived, least-privilege secret leases for Git worktree processes"
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-worktree-secret-broker"
readme = "README.md"
keywords = ["worktree", "secrets", "keychain", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**", "examples/**", "README.md", "LICENSE", "CHANGELOG.md"]

[[bin]]
name = "wsb"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = "0.3"
toml = "0.9"

[dev-dependencies]
tempfile = "3.21"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
